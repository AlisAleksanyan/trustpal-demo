services:
  - type: web
    name: trustpal-paypal-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:render
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ASTRO_MODEL
        value: gpt-5-6-terra
